<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <header>
        <h2>ROCK - PAPER - S CISSORS</h2>
    </header>
    <main class="container">
        <div class="btn">
            <button id="rock-choice" type="button">👊</button>
            <button id="paper-choice" type="button">🖐️</button>
            <button id="scissors-choice" type="button">✌️</button>
        </div>
        <!--some correction how does the js know it is rock or paper so name the  by their charchter -->
        <div class="container-two">
            <div class="choices">
                <p id="human-choice">PLAYER: </p>
                <p id="computer-choice">Computer: </p>
            </div>
                <!--when you try name use standard method human-choice-->
            <div class="game-result">
                <p id="result">Result:</p>
            </div>
            <!--You use same class in the first div and second div -->

            <div class="score-point">
                <p id="human">Player Score:</p>
                <p id="computer">Computer Score:</p>
            </div>
        </div>

    </main>
        <script src="game.js"></script>
    <footer>
    </footer>
</body>
</html>
